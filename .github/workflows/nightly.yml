name: nightly

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: package binary (zip + sha256)
        shell: pwsh
        run: |
          Compress-Archive target/release/aural.exe aural-windows-x64.zip
          $h = (Get-FileHash aural-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/aural-windows-x64.zip.sha256", "$h  aural-windows-x64.zip`n")
      - uses: actions/upload-artifact@v4
        with:
          name: aural-windows-x64
          path: |
            aural-windows-x64.zip
            aural-windows-x64.zip.sha256

  macos:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - run: ./scripts/package-app.sh
      - name: package binary + app (zip + sha256)
        run: |
          cd target/release
          zip -j aural-macos-arm64.zip aural
          ditto -c -k --keepParent Aural.app aural-macos-arm64-Aural.app.zip
          shasum -a 256 aural-macos-arm64.zip > aural-macos-arm64.zip.sha256
          shasum -a 256 aural-macos-arm64-Aural.app.zip > aural-macos-arm64-Aural.app.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aural-macos-arm64
          path: |
            target/release/aural-macos-arm64.zip
            target/release/aural-macos-arm64.zip.sha256
            target/release/aural-macos-arm64-Aural.app.zip
            target/release/aural-macos-arm64-Aural.app.zip.sha256

  linux:
    runs-on: ubuntu-22.04 # libappindicator3-dev is still packaged here
    steps:
      - uses: actions/checkout@v4
      - name: install system build deps (ALSA + GTK/appindicator for the tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libappindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: package binary (tar.gz + sha256)
        run: |
          cd target/release
          tar czf aural-linux-x64.tar.gz aural
          sha256sum aural-linux-x64.tar.gz > aural-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: aural-linux-x64
          path: |
            target/release/aural-linux-x64.tar.gz
            target/release/aural-linux-x64.tar.gz.sha256

  publish:
    # one publish step so the three builds never race on the nightly release
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: nightly
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nightly
          prerelease: true
          make_latest: false
          files: |
            nightly/aural-windows-x64.zip
            nightly/aural-windows-x64.zip.sha256
            nightly/aural-macos-arm64.zip
            nightly/aural-macos-arm64.zip.sha256
            nightly/aural-macos-arm64-Aural.app.zip
            nightly/aural-macos-arm64-Aural.app.zip.sha256
            nightly/aural-linux-x64.tar.gz
            nightly/aural-linux-x64.tar.gz.sha256
