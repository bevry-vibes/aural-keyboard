name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: aural-windows-x64
          path: target/release/aural.exe

  macos:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - run: ./scripts/package-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aural-macos-arm64
          path: |
            target/release/aural
            target/release/Aural.app

  linux:
    runs-on: ubuntu-22.04 # libappindicator3-dev is still packaged here
    steps:
      - uses: actions/checkout@v4
      - name: install system build deps (ALSA + GTK/appindicator for the tray)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libappindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: aural-linux-x64
          path: target/release/aural
