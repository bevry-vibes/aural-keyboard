[package]
name = "aural"
version = "0.2.1"
edition = "2021"
description = "System-wide melodic keyboard sounds: piano for letters, drums for everything else (a port of aural-coding to the OS)"
repository = "https://github.com/bevry-vibes/aural-keyboard"
homepage = "https://github.com/bevry-vibes/aural-keyboard"
license = "RPL-1.5"
keywords = ["keyboard", "audio", "sound", "midi", "typing"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
ctrlc = "3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The menubar subsystem is only compiled and exercised on macOS, keeping the
# Windows/Linux builds free of GUI frameworks (DESIGN.md D8: "add tray/GUI
# without touching the engine").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
png = "0.18"
tray-icon = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
