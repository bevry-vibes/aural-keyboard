[package]
name = "aural"
version = "0.4.0"
edition = "2021"
description = "System-wide melodic keyboard sounds: piano for letters, drums for everything else (a port of aural-coding to the OS)"
repository = "https://github.com/bevry-vibes/aural-keyboard"
homepage = "https://github.com/bevry-vibes/aural-keyboard"
license = "RPL-1.5"
keywords = ["keyboard", "audio", "sound", "midi", "typing"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
crossbeam-channel = "0.5"
ctrlc = "3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The menubar/tray subsystem is compiled on macOS and Linux (GTK +
# libappindicator on Linux, AppKit on macOS), keeping the Windows build free of
# GUI frameworks (DESIGN.md D8: "add tray/GUI without touching the engine").
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
png = "0.18"
tray-icon = "0.24"

[target.'cfg(target_os = "linux")'.dependencies]
# Keyboard hook: raw evdev readers over /dev/input/event* (listen-only, no
# grab) — the only global-capture route that works under both X11 and Wayland.
evdev = "0.13"
# Tray shell: gtk feature enables muda/gtk + libappindicator; libxdo (default)
# is skipped — only the menu separator is used, no clipboard menu items.
gtk = "0.18"
png = "0.18"
tray-icon = { version = "0.24", default-features = false, features = ["gtk"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Console",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
